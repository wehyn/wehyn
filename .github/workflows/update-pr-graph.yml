name: Update PR graph

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_pr_graph.py
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/prs-per-month.svg; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/prs-per-month.svg
          git commit -m "Update PR graph"
          git push
